import org.gradle.api.file.DuplicatesStrategy
import org.gradle.api.tasks.SourceSetContainer

plugins {
    id 'fabric-loom'
    id 'maven-publish'
    id "com.modrinth.minotaur"
}

evaluationDependsOn(":common")

def commonProject = project(":common")
def commonSourceSets = commonProject.extensions.getByType(SourceSetContainer)
def commonMain = commonSourceSets.getByName("main")

base {
    archivesName = project.archives_base_name
}

sourceSets {
    main {
        resources.srcDir("../common/src/main/resources")
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "ai-diary" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation commonMain.output

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Uncomment the following line to enable the deprecated Fabric API modules.
    // These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

    // modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

    // https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-core
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.16.2'
    // https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.16.2'

    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "archivesName", project.base.archivesName

    from("${rootProject.projectDir}/LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }

    from(commonMain.output)
    dependsOn(commonProject.tasks.named("classes"))
}

tasks.named("remapJar") {
    dependsOn(commonProject.tasks.named("remapJar"))
    from {
        zipTree(commonProject.tasks.named("remapJar").get().archiveFile)
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}

import com.modrinth.minotaur.dependencies.ModDependency

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.mod_version}"
    versionName = "v${project.mod_version}-mc${project.minecraft_version}"
    uploadFile = remapJar
    gameVersions = ['1.21.10']
    loaders = ['fabric']
    dependencies = [
            new ModDependency('P7dR8mSH', 'required'), // Fabric API
            new ModDependency('9s6osm5g', 'required') // Cloth Config API
    ]
}
